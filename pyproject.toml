[project]
name = "cc-quota-doctor"
version = "0.1.0"
description = "Offline diagnosis of what burns Claude Code quota, from local transcripts"
license = {text = "MIT"}
requires-python = ">=3.9"
[project.scripts]
cc-quota-doctor = "cc_quota_doctor.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["cc_quota_doctor"]
